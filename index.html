<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0a">
<meta name="format-detection" content="telephone=no">
<title>Café de Paris — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Serif+Georgian:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a0a;
    --panel:#141110;
    --panel-2:#1b1615;
    --red:#9c1327;
    --red-deep:#5e0c19;
    --gold:#c9a24b;
    --gold-soft:#e4c988;
    --cream:#f3ead9;
    --muted:#a89a86;
    --hairline:rgba(201,162,75,0.28);
  }
  *{box-sizing:border-box;}
  html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
  }
  html,body{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--cream);
    font-family:'Noto Serif Georgian','EB Garamond',serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  a, button{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
    position:relative;
  }
  @media (min-width:640px){
    body{background:var(--panel-2);}
    .app{
      box-shadow:0 0 0 1px var(--hairline), 0 30px 70px rgba(0,0,0,0.55);
    }
  }
  a{color:inherit;}

  /* ---------- HEADER / MASTHEAD ---------- */
  .masthead{
    background:
      radial-gradient(140% 70% at 50% -20%, rgba(156,19,39,0.14), transparent 55%),
      linear-gradient(180deg,#0d0b0b 0%,#0b0a0a 100%);
    padding:calc(36px + env(safe-area-inset-top)) 20px 26px;
    text-align:center;
  }
  .logo-img{
    display:block;
    width:min(78vw, 340px);
    height:auto;
    margin:0 auto;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.55));
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    letter-spacing:4px;
    font-size:11px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-style:italic;
    font-weight:600;
    font-size:clamp(34px,9vw,54px);
    letter-spacing:0.2px;
    color:#f6f1e6;
    margin:0;
    line-height:1.05;
  }
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    max-width:240px;
    margin:18px auto;
  }
  .ornament .orn-line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .ornament .orn-mark{
    color:var(--gold);
    font-size:9px;
    transform:rotate(45deg);
    display:inline-block;
  }
  .tagline-pill{
    display:inline-block;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    letter-spacing:3px;
    font-size:12px;
    text-transform:uppercase;
    color:var(--gold-soft);
    border:1px solid var(--hairline);
    padding:7px 20px;
    border-radius:20px;
    background:rgba(156,19,39,0.14);
  }

  /* ---------- LANGUAGE SWITCH ---------- */
  .lang-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:18px 16px 6px;
  }
  .lang-btn{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    letter-spacing:1px;
    font-size:15px;
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--muted);
    padding:10px 22px;
    min-height:42px;
    border-radius:24px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .lang-btn.active{
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    border-color:var(--gold);
    color:#1a1310;
    box-shadow:0 6px 16px rgba(201,162,75,0.3);
  }

  /* ---------- CONTACT PANEL (call button + socials + info chips) ---------- */
  .contact-panel{
    padding:14px 20px 20px;
    background:var(--panel);
    border-top:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);
  }
  .call-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    max-width:420px;
    margin:0 auto 14px;
  }
  .call-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    color:#1a1310;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.3px;
    padding:14px 18px;
    min-height:52px;
    border-radius:30px;
    text-decoration:none;
    box-shadow:0 8px 20px rgba(201,162,75,0.28);
  }
  .call-btn svg{
    width:19px;height:19px;
    stroke:#1a1310;
    fill:none;
    stroke-width:2;
    flex:0 0 auto;
  }
  .social-btn{
    flex:0 0 auto;
    width:52px;
    height:52px;
    border-radius:50%;
    background:#1877F2;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 8px 20px rgba(24,119,242,0.32);
  }
  .social-btn svg{width:24px;height:24px;fill:#fff;}
  .info-chips{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .info-chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:var(--bg);
    border:1px solid var(--hairline);
    border-radius:22px;
    padding:10px 16px;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--cream);
    text-decoration:none;
  }
  .info-chip svg{
    width:14px;height:14px;
    stroke:var(--gold);
    fill:none;
    stroke-width:1.8;
    flex:0 0 auto;
  }

  /* ---------- CATEGORY NAV ---------- */
  .cat-nav-wrap{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(11,10,10,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--hairline);
    padding:10px 0;
  }
  .cat-nav{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:2px 16px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.5px;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--hairline);
    padding:9px 17px;
    min-height:38px;
    border-radius:19px;
    white-space:nowrap;
    cursor:pointer;
  }
  .cat-pill.active{
    color:var(--cream);
    background:linear-gradient(180deg,var(--red) 0%, var(--red-deep) 100%);
    border-color:var(--red);
  }

  /* ---------- CONTENT ---------- */
  main{max-width:640px;margin:0 auto;padding:8px 18px 40px;}

  /* Home grid of category tiles */
  .home-eyebrow{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    letter-spacing:2.5px;
    font-size:12px;
    text-transform:uppercase;
    color:var(--muted);
    margin:18px 0 16px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding-bottom:10px;
  }
  .cat-card{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:14px;
    padding:22px 14px;
    text-align:center;
    cursor:pointer;
    transition:transform .12s ease, border-color .2s ease, background .2s ease;
  }
  .cat-card:active{
    transform:scale(0.96);
    background:var(--panel-2);
  }
  .cat-card-title{
    display:block;
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-style:italic;
    font-weight:600;
    font-size:16.5px;
    line-height:1.28;
    color:var(--gold-soft);
  }
  .cat-card-count{
    display:block;
    margin-top:8px;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* Category page */
  .cat-page-head{padding-top:22px;}
  .back-pill{
    background:linear-gradient(180deg,var(--panel) 0%, var(--panel-2) 100%) !important;
    color:var(--gold-soft) !important;
    border-color:var(--gold) !important;
  }
  section.category{padding-top:36px;scroll-margin-top:80px;}
  .cat-title{
    text-align:center;
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-style:italic;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.3px;
    color:var(--gold-soft);
    margin:0 0 4px;
    text-shadow:0 0 20px rgba(201,162,75,0.18);
  }
  .cat-rule{
    width:64px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:10px auto 24px;
  }
  .item{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:13px 0;
    border-bottom:1px dashed var(--hairline);
  }
  .item:last-child{border-bottom:none;}
  .item-name{
    font-size:16.5px;
    font-weight:600;
    color:var(--cream);
    line-height:1.4;
  }
  .badge-sig{
    display:inline-block;
    margin-left:8px;
    padding:2px 9px 3px;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:#1c140d;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    border-radius:10px;
    vertical-align:2px;
    white-space:nowrap;
  }
  .item-unit{
    display:block;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:var(--muted);
    font-size:12.5px;
    margin-top:1px;
  }
  .leader{
    flex:1;
    border-bottom:1px dotted rgba(201,162,75,0.35);
    transform:translateY(-4px);
    min-width:14px;
  }
  .item-price{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:18.5px;
    letter-spacing:0.2px;
    color:var(--gold-soft);
    text-shadow:0 0 14px rgba(201,162,75,0.22);
    white-space:nowrap;
  }
  .item-price small{font-size:12px;color:var(--muted);font-weight:500;}
  .sizes{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .size-chip{
    text-align:right;
    font-family:'Cormorant Garamond', serif;
  }
  .size-chip .vol{
    display:block;
    font-size:11px;
    letter-spacing:0.5px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .size-chip .val{
    font-weight:600;
    font-size:16px;
    color:var(--gold);
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:36px 20px 10px;
    border-top:1px solid var(--hairline);
    margin-top:40px;
  }
  footer .fw{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-style:italic;
    font-weight:600;
    font-size:22px;
    color:var(--gold-soft);
  }
  footer p{
    font-family:'Cormorant Garamond', serif;
    color:var(--muted);
    font-size:13px;
    max-width:420px;
    margin:10px auto 0;
    line-height:1.5;
  }

  /* ---------- SMALL PHONE REFINEMENTS ---------- */
  @media (max-width:360px){
    .masthead{padding-left:14px;padding-right:14px;}
    main{padding-left:14px;padding-right:14px;}
    .item-name{font-size:15.5px;}
    .item-price{font-size:17px;}
    .cat-title{font-size:23px;}
  }
</style>
</head>

/* ============ RENDER ============ */
let currentLang = 'ka';
let currentView = 'home'; // 'home' or a category id

function renderPrice(item){
  if(item.sizes){
    return `<div class="sizes">${item.sizes.map(s=>`
      <div class="size-chip"><span class="vol">${s.v}</span><span class="val">${s.p} ₾</span></div>
    `).join('')}</div>`;
  }
  return `<span class="item-price">${item.p} ₾</span>`;
}

function homeHTML(){
  return `
    <div class="home-eyebrow">${UI.chooseCategory[currentLang]}</div>
    <div class="cat-grid">
      ${MENU.map(cat=>`
        <div class="cat-card" data-cat="${cat.id}">
          <span class="cat-card-title">${cat.title[currentLang]}</span>
          <span class="cat-card-count">${cat.items.length} ${UI.itemsWord[currentLang]}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function categoryHTML(cat){
  return `
    <div class="cat-page-head">
      <h2 class="cat-title">${cat.title[currentLang]}</h2>
      <div class="cat-rule"></div>
    </div>
    ${cat.items.map(it=>`
      <div class="item">
        <div>
          <div class="item-name">${it.n[currentLang]}${it.sig ? `<span class="badge-sig">${UI.signature[currentLang]}</span>` : ''}</div>
          ${it.u ? `<span class="item-unit">${it.u[currentLang]}</span>` : ''}
        </div>
        ${it.sizes ? '' : '<div class="leader"></div>'}
        ${renderPrice(it)}
      </div>
    `).join('')}
  `;
}

function render(){
  const root = document.getElementById('menuRoot');
  const navWrap = document.getElementById('catNavWrap');
  const nav = document.getElementById('catNav');

  if(currentView === 'home'){
    navWrap.style.display = 'none';
    root.innerHTML = homeHTML();
  } else {
    navWrap.style.display = 'block';
    nav.innerHTML = `
      <div class="cat-pill back-pill" data-back="1">← ${UI.backHome[currentLang]}</div>
      ${MENU.map(cat=>`
        <div class="cat-pill ${cat.id===currentView ? 'active':''}" data-cat="${cat.id}">${cat.title[currentLang]}</div>
      `).join('')}
    `;
    const cat = MENU.find(c=>c.id===currentView);
    root.innerHTML = categoryHTML(cat);
  }

  document.getElementById('eyebrowText').textContent = UI.eyebrow[currentLang];
  document.getElementById('sublineText').textContent = UI.subline[currentLang];
  document.getElementById('addressText').textContent = UI.address[currentLang];
  document.getElementById('footerText').textContent = UI.footer[currentLang];
  document.documentElement.lang = currentLang;
}

/* Delegated clicks: category tiles, nav pills, back button */
document.addEventListener('click', (e)=>{
  const catEl = e.target.closest('[data-cat]');
  if(catEl){
    currentView = catEl.dataset.cat;
    render();
    document.getElementById('menuRoot').scrollIntoView({behavior:'instant', block:'start'});
    return;
  }
  const backEl = e.target.closest('[data-back]');
  if(backEl){
    currentView = 'home';
    render();
    window.scrollTo({top:0, behavior:'instant'});
    return;
  }
});

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
});

render();
</script>
